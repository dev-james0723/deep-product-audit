name: Portable Core QA
on:
  push:
    branches: ["qa/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-core:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ["3.10", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Full test suite (fails if no tests discovered)
        run: python -B tools/run_tests.py
      - name: Disposable runtime, known bug controls and installer smoke
        run: python -B tools/ci_portability_smoke.py
